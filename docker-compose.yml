services:
  api:
    build:
      context: .
    environment:
      MERCURY_ENV: local
      MERCURY_REDIS_URL: redis://redis:6379/0
      MERCURY_MLFLOW_TRACKING_URI: http://mlflow:5000
      MERCURY_POSTGRES_DSN: postgresql://mercury:mercury@postgres:5432/mercury
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury
      POSTGRES_DB: mercury
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mercury:mercury@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  prometheus:
    image: prom/prometheus:v3.0.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    profiles: ["streaming"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --node-id
      - "0"
      - --check=false
    ports:
      - "19092:19092"

volumes:
  postgres-data:
  mlflow-artifacts:
